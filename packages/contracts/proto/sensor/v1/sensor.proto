syntax = "proto3";

package sensor.v1;

import "sensor/v1/measurement.proto";

message BME680 {
  oneof measurement {
    Temperature temperature = 1;
    Humidity humidity = 2;
    Pressure pressure = 3;
  }
}

message SCD41 {
  oneof measurement {
    CO2 co2 = 1;
    Temperature temperature = 2;
    Humidity humidity = 3;
  }
}

message BME280 {
  oneof measurement {
    Temperature temperature = 1;
    Humidity humidity = 2;
    Pressure pressure = 3;
  }
}

message SDS011 {
  oneof measurement {
    PM25 pm25 = 1;
    PM10 pm10 = 2;
  }
}

message ICS43434 {
  oneof measurement {
    NoiseLevel noise_max = 1;
    NoiseLevel noise_avg = 2;
  }
}

message GPS {
  double lat = 1;
  double lon = 2;
  double height_m = 3;
}
