syntax = "proto3";

package device.v1;

import "crypto/v1/encrypted.proto";
import "sensor/v1/sensor.proto";

message UrbanSensor {
  oneof sensor {
    sensor.v1.GPS gps = 1;
    sensor.v1.BME280 bme280 = 2;
    sensor.v1.SDS011 sds011 = 3;
    sensor.v1.ICS43434 ics43434 = 4;
  }
}

message EncryptedUrban {
  repeated UrbanSensor sensors = 1;
}

message Urban {
  repeated UrbanSensor public = 1;
  repeated crypto.v1.Encrypted private = 2;
}
